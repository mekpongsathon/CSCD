name: Code Duplication Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  analyze:
    name: Detect Code Duplication
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Duplication Analyzer
        id: analyze
        env:
          REPO_PATH: ${{ github.workspace }}
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch || 'main' }}
          PR_NUMBER: ${{ github.event.number || 0 }}
          RUN_ID: ${{ github.run_id }}
          REPO_FULL: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: node $GITHUB_WORKSPACE/.github/scripts/analyzer.js
        continue-on-error: true

      - name: Write Job Summary
        if: always()
        run: |
          if [ -f /tmp/report.html ]; then
            cat /tmp/report.html >> $GITHUB_STEP_SUMMARY
          else
            echo "## Analysis failed - no report generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplication-report-pr-${{ github.event.number || github.run_id }}
          path: /tmp/report.html
          if-no-files-found: ignore

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let findings = [], totalChanged = 0;
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/findings.json', 'utf8'));
              findings = data.findings || [];
              totalChanged = data.total_changed || 0;
            } catch (e) {}

            const critical = findings.filter(f => f.severity === 'critical').length;
            const warning = findings.filter(f => f.severity === 'warning').length;
            const info = findings.filter(f => f.severity === 'info').length;
            const icon = findings.length === 0 ? 'OK' : critical > 0 ? 'CRITICAL' : 'WARNING';

            let body = `## ${icon} CSCD2 - Code Duplication Analysis\n\n`;
            body += `**Branch:** \`${context.payload.pull_request.head.ref}\` to \`${context.payload.pull_request.base.ref}\`\n\n`;

            if (findings.length === 0) {
              body += `This pull request looks clean - no significant code duplication found.\n`;
            } else {
              body += `| Metric | Count |\n|--------|-------|\n`;
              body += `| Total Findings | ${findings.length} |\n`;
              body += `| Critical (>=90%) | ${critical} |\n`;
              body += `| Warning (>=75%) | ${warning} |\n`;
              body += `| Info (>=60%) | ${info} |\n\n`;

              const top = findings.slice(0, 5);
              body += `<details>\n<summary>Top ${top.length} Finding(s)</summary>\n\n`;
              body += `| | New File | Similar To | Score | Matches |\n|--|----------|-----------|-------|---------|\n`;
              for (const f of top) {
                body += `| ${f.severity} | \`${f.new_file_path}\` | \`${f.existing_file_path}\` | **${f.similarity_score}%** | ${(f.matching_lines || []).length} |\n`;
              }
              body += `\n</details>\n\n`;
              body += `View Full Report: ${runUrl}\n`;
            }

            body += `\n---\n*Analyzed by CSCD2 - ${totalChanged} file(s) checked*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes('CSCD2 - Code Duplication Analysis'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
