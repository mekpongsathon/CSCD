name: Code Duplication Analysis

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  analyze:
    name: Detect Code Duplication
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Analyzer
        working-directory: apps/analyzer
        run: go build -o analyzer ./main.go

      - name: Trigger Analysis Job
        id: create_job
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.CSCD2_API_URL }}/api/v1/analyze" \
            -H "Content-Type: application/json" \
            -d '{
              "repository_url": "${{ github.event.repository.clone_url }}",
              "branch_name": "${{ github.head_ref }}",
              "pull_request_number": ${{ github.event.number }},
              "base_branch": "${{ github.base_ref }}"
            }')
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          echo "job_id=$(echo $RESPONSE | jq -r '.job_id')" >> $GITHUB_OUTPUT

      - name: Run Analyzer
        id: run_analysis
        run: |
          ./apps/analyzer/analyzer \
            --repo "${{ github.workspace }}" \
            --base "origin/${{ github.base_ref }}" \
            --job-id "${{ steps.create_job.outputs.job_id }}" \
            --output analysis_report.json
        continue-on-error: true

      - name: Read Report
        id: report
        if: always()
        run: |
          if [ -f analysis_report.json ]; then
            FINDINGS=$(cat analysis_report.json | jq '.findings | length')
            CRITICAL=$(cat analysis_report.json | jq '[.findings[] | select(.severity=="critical")] | length')
            echo "findings=$FINDINGS" >> $GITHUB_OUTPUT
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          else
            echo "findings=0" >> $GITHUB_OUTPUT
            echo "critical=0" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        env:
          FINDINGS: ${{ steps.report.outputs.findings }}
          CRITICAL: ${{ steps.report.outputs.critical }}
          JOB_ID: ${{ steps.create_job.outputs.job_id }}
          DASHBOARD_URL: ${{ secrets.CSCD2_DASHBOARD_URL }}
        with:
          script: |
            const findings = parseInt(process.env.FINDINGS || '0');
            const critical = parseInt(process.env.CRITICAL || '0');
            const jobId = process.env.JOB_ID;
            const dashboardUrl = process.env.DASHBOARD_URL;

            let icon = findings === 0 ? '✅' : critical > 0 ? '🚨' : '⚠️';
            let title = findings === 0
              ? 'No code duplication detected'
              : `${findings} duplicate finding(s) detected`;

            let body = `## ${icon} CSCD2 — Code Duplication Analysis\n\n`;
            body += `**Branch:** \`${context.payload.pull_request.head.ref}\`\n\n`;

            if (findings === 0) {
              body += `This pull request looks clean — no significant code duplication found.\n`;
            } else {
              body += `| Metric | Count |\n|--------|-------|\n`;
              body += `| Total Findings | ${findings} |\n`;
              body += `| Critical (≥90%) | ${critical} |\n\n`;
              if (dashboardUrl && jobId) {
                body += `[View Full Report](${dashboardUrl}/jobs/${jobId})\n`;
              }
            }

            body += `\n---\n*Analyzed by [CSCD2](${dashboardUrl || '#'})*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body?.includes('CSCD2 — Code Duplication Analysis'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
